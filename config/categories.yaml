# =====================================================================
#  Ish turlari: KATEGORIYA (keng) → KASB (aniq).
#  2026-09-29: 19 kanaldagi 377 real post asosida tuzildi.
#
#  * Kategoriya — rasm (image), bot qidiruvidagi katta tugma, keng teg (#tibbiyot).
#  * Kasb — aniq teg (#shifokor), bot qidiruvida 2-qadam, obunalarda ham ishlatiladi.
#  * Postdagi teglar: #kasb #kategoriya #hudud + ko'pi bilan 2 ta belgi-teg (pastda). Jami ≤ 5.
#    Kasb va kategoriya tegi bir xil bo'lsa — bittasi yoziladi.
#  * Teg qoidasi: faqat lotin kichik harf, raqam va "_" (apostrof yo'q: o'qituvchi → #oqituvchi).
#  * Kalit so'zlar normalize/fold qilingan matnda qidiriladi (kirill → lotin), shuning uchun
#    ruscha va o'zbek kirill so'zlar ham ishlaydi. So'z chegarasi bilan qidiriladi.
#  * Lavozim (title) dagi moslik 3x ball. Kasb topilmasa — faqat kategoriya; hech narsa → "boshqa".
#  * Kategoriya darajasidagi "keywords" bo'sh — kasblarning kalit so'zlari birlashtiriladi.
#  2026-09-29 (Bosqich 5): kalit so'zlar 374 real postga qarab to'ldirildi. Kategoriya darajasidagi
#  "keywords" — kasbga bog'lanmagan, lekin sohani bildiradigan so'zlar ("restoran", "savdo kompaniyasi").
#  Ball: kasb = 3 x (lavozimdagi so'zlar) + (matndagi so'zlar); kategoriya = eng yaxshi kasbi + o'z so'zlari.
#  Uzunroq moslik ustun: "marketing manager" topilsa, uning ichidagi "manager" hisoblanmaydi.
# =====================================================================

