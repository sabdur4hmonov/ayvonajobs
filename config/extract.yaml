# "X kerak", "ищет X", "We are looking for X" — lavozim shu iboralardan olinadi.
# before: lavozim iboradan OLDIN turadi ("Oshpaz kerak"); after: iboradan KEYIN ("Требуется повар").
hiring_phrases:
  before: [kerak, kk, kerakmi, izlanmoqda, qidirilmoqda, taklif etiladi, taklif etilmoqda, ishga olinadi, ishga olinmoqda, ishga qabul qilinadi, qabul qilinmoqda, ishga taklif qilinadi, qabul qilinadi, ishga olamiz, ishga taklif qilamiz, izlayapmiz, qidiryapmiz, izlaymiz, qidiramiz, требуется, нужен, нужна, нужны, wanted, needed]
  after: [требуется, ищет, ищем, в поисках, "we are looking for", "we're looking for", "looking for", "we are hiring", "we're hiring", "is looking for", "is hiring"]

# Ko'p vakansiyali postdagi ro'yxat sarlavhasi (":" bilan tugaydi): "Ochiq vakansiyalar:"
