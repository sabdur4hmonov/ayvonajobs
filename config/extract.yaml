#  Hammasi FOLD qilingan qatorda qidiriladi: kichik harf, HAMMA kirill → lotin, emoji yo'q.
#  Shuning uchun "Лавозим", "Должность" ham shu yerda lotin/kirill ko'rinishida yozilishi mumkin —
