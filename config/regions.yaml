      Yashnobod: [yashnobod, yashnabad, яшнобод, яшнабад, яшнабадский]
      Yunusobod: [yunusobod, yunusabad, yunsobot, yunusabod, юнусобод, юнусабад, юнусабадский]
    landmarks:
      # metro / mo'ljal → tuman
      - {keywords: [chorsu, чорсу], district: Shayxontohur}
      - {keywords: ["samarqand darvoza", samarkand darvoza, самарқанд дарвоза, самарканд дарвоза], district: Shayxontohur}
      - {keywords: [qoratosh, караташ], district: Shayxontohur}
      - {keywords: ["g'afur g'ulom", gafur gulom, гафур гулям], district: Shayxontohur}
      - {keywords: [novza, новза], district: Chilonzor}
      - {keywords: ["qo'yliq", qoyliq, kuylyuk, куйлюк, куйлик, қўйлиқ], district: Mirobod}
      - {keywords: [ibn sino, ибн сино], district: Olmazor}
      - {keywords: [bodomzor, бодомзор], district: Yunusobod}
      - {keywords: [shahriston, шахристон, шаҳристон], district: Yunusobod}
      - {keywords: [turkiston metro, туркистон метро], district: Yunusobod}
      - {keywords: [minor metro, минор метро], district: Yunusobod}
      - {keywords: ["qo'shbegi", qoshbegi], district: Yunusobod}
      - {keywords: [depo mall], district: Uchtepa}
      - {keywords: [beshyog'och, beshyogoch, бешёғоч, бешагач], district: Yakkasaroy}
      - {keywords: [buyuk ipak yo'li, буюк ипак йўли, буюк ипак йули], district: Mirzo Ulug'bek}
      - {keywords: [mashinasozlar, машинасозлар], district: Yashnobod}
      # tuman aniq emas, lekin Toshkent shahri
