# =====================================================================
#  Hududlar: 14 ta (Toshkent sh. + Toshkent viloyati + 11 viloyat + Qoraqalpog'iston).
#  2026-09-29 (Bosqich 5): 19 kanaldagi 374 real post asosida to'ldirildi.
#
#  Qanday ishlaydi (processing/location.py):
#   * Hamma so'zlar fold qilingan matnda qidiriladi (kichik harf, HAMMA kirill → lotin), shuning uchun
#     "Юнусабад", "Yunusabad", "Юнусобод" bir xil ishlaydi. So'z boshidan (qo'shimchalar mumkin:
#     "Toshkentda", "Chilonzorda").
#   * keywords   — hudud nomi (shahar, viloyat).
#   * districts  — tuman / shahar nomi → shu hududga tegishli ekanini ham bildiradi
#                  (postda "Yunusobod tumani" bo'lsa, "Toshkent" yozilmasa ham hudud = toshkent_sh).
#   * landmarks  — mo'ljal, metro, mahalla, bozor (district bo'lsa — tuman ham aniqlanadi).
#   * Uzunroq moslik ustun: "Toshkent viloyati" → toshkent_vil ("Toshkent" emas),
#     "Samarqand Darvoza" (Toshkentdagi mo'ljal) → toshkent_sh ("Samarqand" emas).
#   * Hudud nomidan keyin "ko'chasi / street / улица" kelsa — bu ko'cha nomi, hudud emas.
#   * Postda 2+ har xil hudud (Toshkent sh. + Toshkent vil. bitta hudud hisoblanadi) → "kop_hudud".
# =====================================================================

regions:
