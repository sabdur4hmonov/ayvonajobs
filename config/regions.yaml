      - {keywords: [tashkent city, toshkent siti, ташкент сити]}
      - {keywords: [magic city, мэджик сити]}
      - {keywords: [paxtakor, pakhtakor, пахтакор]}
      - {keywords: [bunyodkor, бунёдкор]}
      - {keywords: [ming o'rik, мингўрик, минг ўрик]}
      - {keywords: [hamid olimjon, ҳамид олимжон, хамид олимжон]}
