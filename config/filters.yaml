# =====================================================================
#  Filtrlar va e'lon turini aniqlash belgilari.
#  2026-09-29: 19 kanaldan 377 ta real post asosida yangilandi (docs/SOURCE_ANALYSIS.md).
#  Hammasi normalize qilingan matnda qidiriladi (kichik harf, kirill->lotin). Rus so'zlari kirillda qoldi —
#  normalize rus matnini o'zgartirmaydi, shuning uchun ular ham ishlaydi.
#  Admin keyin /addword bilan qo'shadi (filter_words jadvali).
# =====================================================================

# Taqiqlangan so'zlar — bunday e'lon rad etiladi.
# DIQQAT: yolg'iz "stavka" so'zi yo'q — "to'liq stavka", "0,5 stavka" oddiy ish e'lonlarida uchraydi!
ban:
  - kazino
  - casino
  - казино
  - bukmeker
  - букмекер
  - sport stavka
  - ставки на спорт
  - 1xbet
  - narkotik
  - закладчик
  - kladchik

# Spam belgilari
spam:
  - pul ishlash oson
  - kuniga 100$
  - заработок без вложений
  - investitsiya qiling
  - kripto signal

# Firibgarlik belgilari — aggregator'da: e'lon chiqmaydi, admin'ga "shubhali" deb yuboriladi.
# User e'lonida: admin tekshiruviga.
scam:
  - oldindan to'lov
  - depozit
  - viza uchun pul
  - предоплата
  - оплата за оформление
  - suxoy arenda                # taksi mashinasi ijarasi — ish emas
  - mashina ijaraga beramiz
  - hujjat uchun to'lov
  - forma uchun pul
  - o'qish uchun to'lov qilasiz
  - karta raqamingizni yuboring
  - sms kodni yuboring

# Scam so'zi shu iboralar ichida bo'lsa — firibgarlik EMAS (ish vazifasi):
# "mijozlardan oldindan to'lovlarni qabul qilib" — sotuv menejerining vazifasi.
scam_exceptions:
  - oldindan to'lovlarni qabul
  - oldindan to'lovni qabul
  - oldindan to'lov qabul

# Manba kanallarning reklama qatorlari (umumiy; kanalga xos qoidalar — config/source_rules.yaml)
ad_patterns:
  - obuna bo'ling
  - kanalimizga
  - reklama uchun
  - подписывайтесь
  - наш канал
  - ish kanallari to'plami
  - kanalda xar kuni
  - kanalda har kuni

