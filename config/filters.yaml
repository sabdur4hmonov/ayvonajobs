  - jamoasini kengaytir
  - "we're hiring"
  - we are hiring
  - join our team
  - is looking for
  - duties
  - в поисках

# Aniq REKLAMA / e'lon emas. Qoida: topilgan reklama belgilari soni >= job ball bo'lsa (va job ball < 4) — not_job.
# ("chegirma" ish e'lonida ham uchraydi: "xodimlarga 50% chegirma" — shuning uchun bitta belgi hal qilmaydi.)
not_job_markers:
  - "#reklama"
  - "erid="
  - dars narxi
  - chegirma
  - bepul dars
  - darsga yozilish
  - qabul ochiq            # o'quv markaz o'quvchi qabuli (ehtiyot: "ishga qabul" bilan adashtirmaslik — job_markers ustun)
  - kursimizga
  - video darslik
  - video yuklab olish
  - bot orqali test
  - testlar shu yerda
  - forumga taklif
  - ro'yxatdan o'ting va tadbir
  - vebinar
  - webinar
  - live stream
  - jonli efir
  - xizmatlarimiz
  - бухгалтерия хизматлари
  - хизматлари
  - bepul maslahat
  - viloyatlarni tanlang
  - вилоятларни танланг
  - "#hazil"
  - "#dayjest"
  - "#маьлумот"
  - "#фойдали"

# REZYUME — ish qidiruvchining e'loni (v1 da chiqarilmaydi; keyin "Rezyumelar" bo'limi uchun saqlanadi)
resume_markers:
  - ish qidiryapman
  - ish izlayapman
  - иш излаяпман
  - ish joyi kerak
  - ish joyi qidiryapman
  - ism-familiya
  - "исмим:"               # ikki nuqta bilan: maslahat postidagi "Mening ismim Ali" rezyume emas
  - tug'ilgan sana
  - туғулган сана
  - malaka va tajriba
  - ищу работу
  - резюме соискателя

# YOPILGAN vakansiya — chiqarilmaydi
closed_markers:
  - vakansiya yopildi
  - "#vakansiyayopildi"
  - bu vakansiya yopilgan
  - вакансия закрыта
  - position closed

# IMKONIYAT (grant, fellowship, bepul kurs, tadbir, haq to'lanmaydigan amaliyot) — v1 da chiqarilmaydi
# (keyin alohida "Imkoniyatlar" rukni bo'lishi mumkin). Haq to'lanadigan stajirovka — "amaliyot" kategoriyasi, job.
opportunity_markers:
  - fellowship
  - grant
  - scholarship
  - stipendiya
  - dev camp
  - akademiyasiga arizalar
  - ishtirok etish bepul
  - bepul o'qitilmoqda
  - forum
  - hackathon
  - xakaton

# HAL QILUVCHI imkoniyat belgilari — job ball qancha bo'lsa ham opportunity (haq to'lanmaydigan amaliyot).
opportunity_strong_markers:
  - amaliyot uchun haq to'lanmaydi
  - haq to'lanmaydigan amaliyot
  - bepul amaliyot
  - unpaid internship
  - неоплачиваемая стажировка
