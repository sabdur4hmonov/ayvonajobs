# Rezyumeni SHAKLIDAN topish (hech bir heshteg/ibora bo'lmasa ham). Ish beruvchilar ham "Yosh:", "Tajriba:",
# "Oylik:" yozadi — shuning uchun uchta shart BIRGA kerak:
#   1) kamida min_labels ta har xil profil yorlig'i (qator boshida, ikki nuqta bilan);
#   2) ish izlovchiga xos dalil: "Portfolio:" yorlig'i YOKI "Xodim:/Ism:" maydonida odam ismi (2-4 ta bosh harfli
#      so'z, kasb nomi emas: "Xodim: Ali Valiyev" — ha, "Xodim: Sotuvchi" — yo'q);
#   3) ish beruvchi belgisi YO'Q (Talablar, Vazifalar, Kompaniya, Vakansiya, "ishga taklif" ...).
