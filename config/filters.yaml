# Taqiqlangan so'zlar — bunday e'lon rad etiladi
ban:
  - kazino
  - casino
  - казино
  - stavka
  - ставки

# Spam belgilari
spam:
  - pul ishlash oson
  - kuniga 100$
  - заработок без вложений

# Firibgarlik belgilari — user e'loni admin tekshiruviga yuboriladi
