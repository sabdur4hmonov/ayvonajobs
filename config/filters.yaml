  - oldindan to'lov
  - depozit
  - viza uchun pul
  - предоплата
  - оплата за оформление

# Manba kanallarning reklama qatorlari (tozalashda olib tashlanadi)
ad_patterns:
  - obuna bo'ling
  - kanalimizga
  - reklama uchun
  - подписывайтесь
  - наш канал
