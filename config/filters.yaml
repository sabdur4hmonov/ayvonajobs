# IMKONIYAT (grant, fellowship, bepul kurs, tadbir, haq to'lanmaydigan amaliyot) — v1 da chiqarilmaydi
# (keyin alohida "Imkoniyatlar" rukni bo'lishi mumkin). Haq to'lanadigan stajirovka — "amaliyot" kategoriyasi, job.
opportunity_markers:
  - fellowship
  - grant
  - scholarship
  - stipendiya
  - dev camp
  - akademiyasiga arizalar
  - ishtirok etish bepul
  - bepul o'qitilmoqda
  - forum
  - hackathon
  - xakaton

# HAL QILUVCHI imkoniyat belgilari — job ball qancha bo'lsa ham opportunity (haq to'lanmaydigan amaliyot).
opportunity_strong_markers:
  - amaliyot uchun haq to'lanmaydi
  - haq to'lanmaydigan amaliyot
  - bepul amaliyot
  - unpaid internship
  - неоплачиваемая стажировка

# Hal qiluvchi belgi bo'lsa ham, shu iboralardan biri ham bo'lsa — hal qilmaydi (Bosqich 5, 2026-09-29):
# @digitalitvacancy/742 "Dastlabki 2 oy – bepul amaliyot; 3-oydan boshlab haq to'lanadi, rasmiy shartnoma" —
# keyin haq to'lanadigan ishga olish, shuning uchun job (e'lon yo'qolgani ikki marta chiqqanidan yomonroq).
opportunity_strong_exceptions:
  - haq to'lanadi
  - haq to'lana boshlaydi
  - oylik to'lanadi
  - maosh to'lanadi
