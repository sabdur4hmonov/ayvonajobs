  - ishga taklif
  - ishga qabul
  - ishga olamiz
  - vakansiya
  - lavozim
  - maosh
  - oylik
  - ish haqi
  - daromad
  - ish vaqti
  - ish grafigi
  - talablar
  - bog'lanish
  - murojaat uchun
  - aloqa uchun
  - вакансия
  - требуется
  - ищем
  - зарплата
  - график
  - обязанности
  - требования
  - hiring
  - "we're looking for"
  - we are looking for
  - job title
  - position
  - salary
  - requirements
  - how to apply
  # 2026-09-29 (Bosqich 4): POST_EXAMPLES dagi e'lonlar ball yetmay qolgani uchun qo'shildi
  - kk                     # "kerak" ning qisqartmasi: "odam kk"
  - jamoasiga qo'shiling
  - jamoamizga qo'shiling
  - oklad
  - оклад
  - biz taklif qilamiz
  - tasks
  - responsibilities
  - cv
  - vazifalar
  - tajriba shart emas
  - tajriba talab etilmaydi
  - anketa to'ldiring
  - anketani to'ldiring
