# Aniq REKLAMA / e'lon emas. Qoida: topilgan reklama belgilari soni >= job ball bo'lsa (va job ball < 4) — not_job.
# ("chegirma" ish e'lonida ham uchraydi: "xodimlarga 50% chegirma" — shuning uchun bitta belgi hal qilmaydi.)
not_job_markers:
  - "#reklama"
  - "erid="
  - dars narxi
  - chegirma
  - bepul dars
  - darsga yozilish
  - qabul ochiq            # o'quv markaz o'quvchi qabuli (ehtiyot: "ishga qabul" bilan adashtirmaslik — job_markers ustun)
  - kursimizga
  - video darslik
  - video yuklab olish
  - bot orqali test
  - testlar shu yerda
  - forumga taklif
  - ro'yxatdan o'ting va tadbir
  - vebinar
  - webinar
  - live stream
  - jonli efir
  - xizmatlarimiz
  - бухгалтерия хизматлари
  - хизматлари
  - bepul maslahat
  - viloyatlarni tanlang
  - вилоятларни танланг
  - "#hazil"
  - "#dayjest"
  - "#маьлумот"
  - "#фойдали"
  # Maosh jadvali / yangilik ("1-sentyabrdan pedagoglar qancha maosh oladilar" — @edustaffs/6799).
  # Bittasi yetmaydi: reklama belgilari soni job balldan kam bo'lmasligi kerak (classify.py).
  - prezident farmoni
  - vazirlar mahkamasi qarori
  - maosh oladilar
  - oylik oladilar
  - qo'lga tegishi
  - ish haqlari miqdori
  - toifalar bo'yicha
  # Kurs / video darslik reklamasi (Bosqich 7, @Buxgalteriyaishorinlarii/5450)
  - videoqo'llanma
  - video qo'llanma
  - videodarslik
  - видеоурок

# HAL QILUVCHI reklama belgilari — job ball qancha bo'lsa ham not_job (kurs mavzulari ro'yxati).
# Nega kerak: @Buxgalteriyaishorinlarii/5450 ("Video darsliklar mavzusi", 74 ta 1C darsi) ichida "oylik",
# "ish grafigi", "daromad" so'zlari dars nomlarida uchraydi -> job ball 4, oddiy reklama qoidasi esa faqat
# ball < 4 da ishlaydi. Shuning uchun faqat KURS SARLAVHASIGA xos iboralar (ish e'lonida uchramaydigan).
# ⚠️ "kurs dasturi", "dars mavzulari" ataylab YO'Q: "kurs dasturini bilish" o'qituvchi e'lonida uchraydi.
not_job_strong_markers:
  - video darsliklar mavzusi
  - videodarsliklar mavzusi
  - video darslar mavzusi
  - darsliklar ro'yxati
  - bo'yicha videoqo'llanma
  - темы видеоуроков
  - программа видеокурса

