# =====================================================================
#  Ayvona Jobs — asosiy sozlamalar (maxfiy emas, git'ga qo'shiladi)
#  Maxfiy narsalar (token, API_HASH) bu yerda EMAS — .env faylida.
# =====================================================================

# --- Manbalar ---------------------------------------------------------
# E'lonlar o'qiladigan kanallar. Hozircha bo'sh.
# Qo'shish uchun "[]" ni o'chirib, pastdagi namunaga o'xshab yozing:
#
# sources:
#   - type: telegram            # hozircha faqat "telegram" (keyin "web:..." qo'shiladi)
#     identifier: "@kanal_nomi"  # kanal username'i (yoki t.me/kanal_nomi)
#     title: "Kanal nomi"         # ixtiyoriy, o'zingiz uchun
#     enabled: true              # vaqtincha o'chirish uchun: false
#     own_usernames:             # shu kanalning o'z reklama @username/havolalari (tozalashda o'chiriladi)
#       - "@kanal_nomi"
#
# Diqqat: Telethon akkauntingiz shu kanallarga a'zo bo'lishi shart emas (ochiq kanal bo'lsa),
# lekin yopiq kanallar uchun a'zo bo'lishi kerak.
# Ro'yxatdan olib tashlangan kanal bazadan o'chirilmaydi — faqat "enabled=false" bo'ladi.
sources:
  - type: telegram
    identifier: "@ishtoparuz_kanal"
    own_usernames: ["@ishtoparuz_kanal"]
  - type: telegram
    identifier: "@beminnatvakant_ish"
    own_usernames: ["@beminnatvakant_ish", "@tilchi_tarjimon_jobs", "@Kvartira_uylar_Tashkent"]
  - type: telegram
    identifier: "@ishmi_ish"
    own_usernames: ["@ishmi_ish"]
  - type: telegram
    identifier: "@ish_kerak_edu"
    own_usernames: ["@ish_kerak_edu", "@ish_kerak_edu_admini"]
  - type: telegram
    identifier: "@manavakansiya_uz"
    own_usernames: ["@manavakansiya_uz"]
  - type: telegram
    identifier: "@ishlaUZ_rasmiy"
    own_usernames: ["@ishlaUZ_rasmiy", "@ishla_uz1"]
  - type: telegram
    identifier: "@ishtopuz_rasmiy"
    own_usernames: ["@ishtopuz_rasmiy", "@ishbor_ishtop_ishkerak"]
  - type: telegram
    identifier: "@unilance"
    own_usernames: ["@unilance", "@webmakon"]
  - type: telegram
    identifier: "@kasbdoruz"
    own_usernames: ["@kasbdoruz", "@kasbdor_uz"]
  - type: telegram
    identifier: "@jobmakon"
    own_usernames: ["@jobmakon"]
  - type: telegram
    identifier: "@NextHireX"
    own_usernames: ["@NextHireX"]
  - type: telegram
    identifier: "@huntmejob"
    own_usernames: ["@huntmejob", "@huntmeglobal", "@huntmegroup", "@huntmesmartassistantbot", "@huntmemarketplace"]
  - type: telegram
    identifier: "@huntmeglobal"
    own_usernames: ["@huntmeglobal", "@huntmejob", "@huntmegroup", "@huntmesmartassistantbot", "@huntmemarketplace"]
  - type: telegram
    identifier: "@toshkentda_ish_bor_ishchi"
    own_usernames: ["@toshkentda_ish_bor_ishchi"]
  - type: telegram
    identifier: "@Buxgalteriyaishorinlarii"
    own_usernames: ["@Buxgalteriyaishorinlarii"]
  - type: telegram
    identifier: "@edustaffs"
    own_usernames: ["@edustaffs", "@Entrepreneur_J"]
  - type: telegram
    identifier: "@Ish_Toshkent"
    own_usernames: ["@Ish_Toshkent"]
  - type: telegram
    identifier: "@digitalitvacancy"
    own_usernames: ["@digitalitvacancy"]
  - type: telegram
    identifier: "@jobs_fba"
    own_usernames: ["@jobs_fba"]
  - type: telegram
    identifier: "@migratsiyaagentligi"
    title: "Xorijda ish (Migratsiya agentligi, rasmiy)"
    own_usernames: ["@migratsiyaagentligi"]

# --- Collector (kanallarni o'qish) ------------------------------------
collector:
  poll_interval_seconds: 90          # har necha soniyada hamma kanallar tekshiriladi
  initial_backfill: 0                # yangi kanal qo'shilganda nechta eski post olinsin (0 = faqat bundan keyingilari)
  fetch_limit: 200                   # bitta so'rovda bitta kanaldan max nechta post (qolgani keyingi siklda)
  delay_between_sources_seconds: 2.5 # kanallar orasida kutish (Telegram'ni bezovta qilmaslik uchun)
  fetch_timeout_seconds: 120         # bitta kanal shuncha vaqtda javob bermasa — xato deb hisoblanadi
  heartbeat_interval_seconds: 60     # "tirikman" belgisi (kv_store) har necha soniyada yoziladi

# --- Worker: yangi postlarni qayta ishlash (apps/worker.py) --------------
worker:
  poll_interval_seconds: 15          # har necha soniyada yangi postlar tekshiriladi
  album_wait_seconds: 60             # post kelganidan keyin shuncha kutiladi (albomning hamma rasmlari kelsin)
  batch_size: 50                     # bir aylanishda nechta post
  heartbeat_interval_seconds: 60     # "tirikman" belgisi (kv_store)
  dedup_reload_hours: 6              # dublikat indeksi bazadan qayta yuklanadi (14 kundan eskilar tushadi)
  reformat_queued_on_start: true     # start'da navbatdagi (queued/retry) e'lonlar hozirgi formatter/branding bilan qayta yasaladi

# --- Publisher (kanalga joylash) ---------------------------------------
publisher:
  publish_interval_seconds: 60       # kanalga postlar orasidagi minimal vaqt
  max_publish_attempts: 8            # shuncha xatodan keyin "failed" + admin'ga xabar
  hold_minutes: 20                   # yangi e'lon shuncha kutadi: boshqa kanalda to'liqroq nusxasi chiqsa, o'sha chiqadi
  publish_backfill: false            # kanal qo'shilganda olingan ESKI postlar ham chiqsinmi (initial_backfill)
  max_age_hours: 24                  # manbada shundan oldin chiqqan e'lon kanalga chiqmaydi (skipped_old, bazada qoladi). 0 = o'chiq
  retry_base_seconds: 30             # tarmoq xatosi: 30 s, 60 s, 120 s ... kutib qayta urinadi
  retry_max_seconds: 3600            # ... lekin 1 soatdan ko'p emas
  config_error_pause_seconds: 300    # token xato / bot kanalda admin emas: 5 daqiqa hech narsa yubormaydi
  idle_poll_seconds: 5               # navbat bo'sh bo'lsa, shuncha soniyada bir tekshiradi

# --- Monitoring (worker tekshiradi, muammo bo'lsa admin chatga yozadi) ----
monitoring:
  check_interval_minutes: 5          # har necha daqiqada tekshiriladi
  heartbeat_stale_minutes: 10        # collector/bot shuncha vaqt "tirikman" demasa — ogohlantirish
  source_silence_hours: 24           # manbadan shuncha soat post kelmasa — ogohlantirish (kanal o'chgan / bloklagan?)
  source_error_threshold: 5          # manba ketma-ket shuncha marta xato bersa — ogohlantirish

# --- Kunlik backup (services/backup.py) --------------------------------
backup:
  enabled: true
  hour: 3                            # Toshkent vaqti bilan 03:00 da
  minute: 0
  keep: 7                            # data/backups/ da oxirgi 7 ta nusxa qoladi (ayvona_YYYY-MM-DD.db)
  dir: "data/backups"
  send_to_admin: true                # nusxa admin chatga fayl bo'lib ham yuboriladi
  max_send_mb: 45                    # bundan katta fayl yuborilmaydi (Bot API chegarasi 50 MB)

# --- Kanal posti ko'rinishi (processing/formatter.py) --------------------
branding:
  channel_username: "ayvonajobs"     # bizning kanal (imzo: "📢 @ayvonajobs — Ayvona Jobs")
  channel_title: "Ayvona Jobs"
  bot_username: "ayvona_jobs_bot"    # ommaviy bot (imzo "🔍 Ish qidiryapsizmi? @ayvona_jobs_bot" va tugmalar)

formatter:
  min_confidence: 0.7                # extract ishonchi shundan past bo'lsa — fallback shablon (tozalangan asl matn)
  max_caption_length: 1024           # Telegram rasm osti matni chegarasi
  max_tags: 5                        # #kasb #kategoriya #hudud + belgi-teglar, jami
  max_feature_tags: 2                # #masofaviy #tajribasiz ... ko'pi bilan nechta
  max_contacts: 3                    # har turdagi aloqadan (telefon, @username) ko'pi bilan nechta

# --- Post rasmlari (processing/images.py, docs/IMAGES.md) ----------------
images:
  root: "assets/images"              # <kategoriya>/<kasb>/ papkalari
  fallback_category: "boshqa"        # hech narsa topilmasa shu papka

# --- Ommaviy bot (@ayvona_jobs_bot, bot/) ---------------------------------
bot:
  throttle_seconds: 1                # bitta foydalanuvchidan 1 soniyada 1 ta so'rov (ortig'i e'tiborsiz). Adminlarga ta'sir qilmaydi
  touch_interval_seconds: 60         # users.last_active_at shuncha vaqtda bir yangilanadi

# --- 📢 E'lon joylash: foydalanuvchi e'lonlari (services/job_submission.py) --------
posting:
  max_per_day: 2                     # bitta foydalanuvchi 24 soatda nechta e'lon yubora oladi
  min_interval_minutes: 10           # e'lonlar orasida kamida shuncha daqiqa
  max_waiting: 1                     # bir vaqtda nechta e'lon tekshiruvda/navbatda bo'lishi mumkin
  moderation: suspicious_only        # auto | suspicious_only (shubhali + yangi foydalanuvchining 1-e'loni) | all
  max_links: 2                       # bundan ko'p havola — spam
  max_caps_ratio: 0.6                # harflarning shuncha qismi KATTA bo'lsa — spam
  max_emoji: 10                      # bundan ko'p emoji — spam
  duplicate_days: 14                 # shu kunlar ichidagi bir xil e'lon — rad etiladi
  max_title: 100                     # lavozim uzunligi (belgi)
  max_short_field: 150               # kompaniya, maosh, manzil, ish vaqti
  max_requirements: 600              # talablar / izoh

# --- 🔍 Ish qidirish (services/search.py) ---------------------------------
search:
  page_size: 5                       # natijalar sahifasida nechta e'lon
  salary_steps: [2000000, 4000000, 6000000, 10000000]   # "2 mln+" ... tugmalari (so'm, oylik)
  usd_rate_fallback: 12800           # cbu.uz dan kurs olinmasa shu ishlatiladi (USD maoshni so'mga solishtirish)
  usd_rate_url: "https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/"   # Markaziy bank ochiq API (bepul)
  usd_rate_refresh_hours: 24         # worker kursni kuniga 1 marta yangilaydi

# --- 🔔 Obunalar (services/alerts.py, worker ichida) ------------------------
alerts:
  max_per_user: 5                    # bitta foydalanuvchida nechta obuna
  daily_limit: 20                    # 24 soatda ko'pi bilan nechta xabar; qolganlari kechki dayjestga
  digest_hour: 20                    # dayjest Toshkent vaqti bilan shu soatda
  digest_max_items: 20               # dayjestda ko'pi bilan nechta e'lon
  per_second: 25                     # Bot API chegarasi (~30/s) — sekundiga shundan ko'p yubormaydi
  poll_seconds: 30                   # kanalga yangi chiqqan e'lonlar shuncha soniyada bir tekshiriladi

# --- E'lon muddati (services/expiry.py, worker ichida) ------------------------
expiry:
  aggregator_days: 21                # kanallardan olingan e'lon shuncha kundan keyin qidiruvdan chiqadi
  user_days: 30                      # foydalanuvchi e'loni — shuncha kun (uzaytirsa yana shuncha)
  remind_days_before: 2              # foydalanuvchiga "Uzaytirasizmi?" — tugashidan shuncha kun oldin
  check_minutes: 30                  # shuncha daqiqada bir tekshiriladi (kanaldagi postga tegilmaydi)

# --- /broadcast (admin: hamma foydalanuvchilarga xabar) -------------------------
broadcast:
  per_second: 20                     # sekundiga shuncha xabar (Bot API chegarasidan past)

# --- 🤖 Gemini yordamchi (ixtiyoriy, ai/) ---------------------------------------
# Faqat .env da GEMINI_API_KEY bo'lsa ishlaydi. Kalit yo'q yoki xato bo'lsa — hammasi regex bilan (avvalgidek).
# Admin botda: /ai — holat, bugungi so'rovlar, yoqish/o'chirish.
ai:
  enabled: true
  min_confidence: 0.7                # regex ishonchi shundan past bo'lsa (yoki e'lon ruscha/inglizcha) — Gemini'dan so'raladi
  translate_foreign: true            # ru/en e'lonni to'liq o'zbek lotinga o'giradi
  daily_limit: 200                   # kuniga ko'pi bilan nechta so'rov (Toshkent kuni, hamma kalitlar)
  min_interval_seconds: 4            # so'rovlar orasida (bepul tarif daqiqasiga bir necha so'rov)
  timeout_seconds: 10
  pause_minutes_rate_limited: 60     # 429 (limit) dan keyin shu kalit shuncha daqiqa ishlatilmaydi
  pause_minutes_error: 5             # 5xx / timeout / tarmoq xatosidan keyin
  max_input_chars: 3000              # e'lon matni shundan uzun bo'lsa qisqartirib yuboriladi

# --- 🌐 Veb-saytlar, API va RSS manbalar (sources/web/) ------------------------
# Botda: /addsource web:himalayas (rss:<URL> ...), /sources — yoqish/o'chirish/oraliq. Kod/YAML tahrir kerak emas.
# Har saytning o'z shartidagi chegaralar (kuniga nechta so'rov, oraliq) kodda — bu yerdan oshirib bo'lmaydi.
web_sources:
  user_agent: "AyvonaJobsBot/1.0 (+https://t.me/ayvonajobs)"
  timeout_seconds: 30
  fetch_limit: 50                    # bir so'rovda bitta manbadan ko'pi bilan nechta yangi e'lon
  max_international_per_day: 12      # xalqaro masofaviy e'lonlar kanalga kuniga (hamma saytlardan jami)
  default_interval_minutes: 30       # yangi qo'shilgan sayt/RSS shuncha daqiqada bir tekshiriladi
  osonish_max_pages: 20              # Oson Ish: bir aylanishda ko'pi bilan nechta e'lon sahifasi o'qiladi

# --- 🌍 O'z veb-sayti (apps/web.py, Bosqich 17) -------------------------------------
# Hozircha faqat o'qish uchun: e'lonlar, qidiruv, kategoriya/hudud sahifalari, sitemap.xml.
website:
  host: "127.0.0.1"                  # serverda oldida Caddy (HTTPS) turadi — deploy/Caddyfile.example
  port: 8080
  base_url: ""                       # ochiq manzil, masalan "https://ayvona.duckdns.org" (sitemap va canonical uchun)
  page_size: 20                      # sahifada nechta e'lon
  sitemap_limit: 5000                # sitemap.xml da ko'pi bilan nechta e'lon
